global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: project-back
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3010"]
        labels:
          service: project-back

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
