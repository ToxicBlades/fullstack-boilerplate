packages:
  - apps/*
  - libs/*

overrides:
  better-call: 1.3.7

# Allow dependency lifecycle scripts (pnpm v11+ reads this instead of package.json "pnpm").
allowBuilds:
  "@prisma/client": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true