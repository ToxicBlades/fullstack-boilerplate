name: projects

services:
  db:
    image: postgres:17.2
    container_name: db
    # expose:
    #   - "5432"
    ports:
      - '5432:5432'
    command: ["-c", "max_connections=500"]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - my_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - my_net

  migrate:
    container_name: migrate
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: ./apps/back/Dockerfile
      target: migrator
    image: back-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Required by env-config.ts (imported via knexfile / auth) even though migrate does not bind a port.
      BACK_HOST: ${BACK_HOST:-0.0.0.0}
      BACK_PORT: ${BACK_PORT:-3010}
      BACK_COMMON_RATE_LIMIT_MAX_REQUESTS: ${BACK_COMMON_RATE_LIMIT_MAX_REQUESTS:-100}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-postgres}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    restart: "no"
    networks:
      - my_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - my_net

  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    networks:
      - my_net
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    command: ["/data"]
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    restart: always
    networks:
      - my_net

  rustfs-init:
    profiles: ["rustfs-init"]
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/rustfs/init.sh:/init.sh:ro
      - ./.rustfs:/rustfs-out
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADMIN_USER: ${RUSTFS_ADMIN_USER:-${RUSTFS_ACCESS_KEY:-rustfsadmin}}
      RUSTFS_CREDS_FILE: /rustfs-out/credentials.env
      RUSTFS_INIT_FORCE_REGEN: ${RUSTFS_INIT_FORCE_REGEN:-}
      RUSTFS_INIT_SKIP_CREDS: ${RUSTFS_INIT_SKIP_CREDS:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_RECIPES_BUCKET: ${S3_RECIPES_BUCKET:-}
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET:-}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    networks:
      - my_net

volumes:
  db-data:
  rustfs-data:

networks:
  my_net:
